---
# The logic behind every repository's ci-ok check. A caller runs it on
# pull_request; it waits for every other check on the head commit and fails
# if one did not pass. A job GitHub cancelled because a newer job queued for
# the same concurrency group (a gh-pages deploy, say) is not a verdict on the
# commit and is skipped; any other cancellation fails. Re-run the caller after
# re-running a failed check. A caller may also run on workflow_dispatch
# against a branch, for pull requests opened with GITHUB_TOKEN (release-please),
# which start no pull_request workflows; the head commit is then github.sha.
# The step needs only curl and jq, so it also runs on a minimal self-hosted
# runner image, which has no gh.
name: Wait for checks

"on":
  workflow_call:
    inputs:
      runs-on:
        description: The runner label the wait runs on.
        type: string
        default: ubuntu-latest

permissions:
  checks: read

jobs:
  wait:
    name: wait
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 90
    steps:
      - name: Wait for every other check on the head commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          api() {
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" "$GITHUB_API_URL/$1"
          }
          # Every check run on the commit, one page of 100 at a time.
          check_runs() {
            local page=1 body
            while :; do
              body=$(api "repos/$REPO/commits/$SHA/check-runs?per_page=100&page=$page")
              jq -r '.check_runs[] | select(.name | startswith("ci-ok") | not) | "\(.id)\t\(.status)\t\(.conclusion // "-")\t\(.name)"' <<<"$body"
              [ "$(jq '.check_runs | length' <<<"$body")" -lt 100 ] && return
              page=$((page + 1))
            done
          }
          # Give the workflows started by the same event time to register.
          sleep 30
          settled=0
          while :; do
            runs=$(check_runs)
            failed=0
            pending=0
            while IFS=$'\t' read -r id status conclusion name; do
              [ -z "$id" ] && continue
              echo "$status $conclusion $name"
              if [ "$status" != completed ]; then
                pending=1
                continue
              fi
              case "$conclusion" in
                failure | timed_out | action_required | startup_failure)
                  failed=1
                  ;;
                cancelled)
                  if api "repos/$REPO/check-runs/$id/annotations" | jq -r '.[].message' |
                    grep -q 'higher priority waiting request'; then
                    echo "  replaced by a newer job in its concurrency group; skipped"
                  else
                    failed=1
                  fi
                  ;;
              esac
            done <<<"$runs"
            if [ "$failed" = 1 ]; then
              echo "::error::A check on $SHA did not pass"
              exit 1
            fi
            if [ "$pending" = 1 ]; then settled=0; else settled=$((settled + 1)); fi
            # Two quiet polls in a row: nothing is pending and nothing new appeared.
            [ "$settled" -ge 2 ] && exit 0
            sleep 20
          done
