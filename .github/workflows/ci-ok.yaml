---
# The check the ruleset on main requires; the logic is wait-for-checks.yaml.
# Other repositories call it as
# JanWelker/renovate-config/.github/workflows/wait-for-checks.yaml@<sha> # <tag>.
name: CI OK

"on":
  pull_request:

permissions:
  checks: read

concurrency:
  group: ci-ok-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci-ok:
    uses: ./.github/workflows/wait-for-checks.yaml
